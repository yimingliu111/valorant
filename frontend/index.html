<script type="module">
import { FilesetResolver, HandLandmarker } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

const DEMO = new URLSearchParams(location.search).has("demo"); // 无摄像头时的视觉演示模式
let _lastTickT = 0;                          // 上一帧时间戳，用于计算真实 dt

const video  = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");
const hint   = document.getElementById("hint");
const flashBg= document.getElementById("flash-bg");

/* ================= 元素注册表 =================
   新增元素：照下面 wind/fire 的样子加一个对象（update / drawHold 必选，
   tick / hint / flash* 可选），注册进 ELEMENTS 即会自动出现在切换按钮里。 */

const POINT_ENTER = 0.13;   // 投影小于此 = 手指指向镜头（此时伸展判定会失效，仍视为激活）
const HAND_LOST_GRACE = 0.45;   // 手部短暂丢失的宽限期（秒）：期间特效原地保持，不闪断
const ORBIT_RADIUS = 60, ORBIT_SPEED = 2.2;   // 飞镖公转参数

const windElement = {
  name: "wind", label: "飞镖",
  hint: "看招",
  flashText: "风 来 ！", flashBg: "rgba(150,255,190,.28)",
  flashColor: "#eafff0", flashShadow: "#7dffb0", flashShadow2: "#2fbf7f",

  update(s, c) {
    const lm = c.lm, tip = lm[8], pip = lm[6], wrist = lm[0];
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    // 激活判定：手指伸展；指向镜头时投影很短、伸展判定会失效，故并入
    const fingerUp = d(tip, wrist) > d(pip, wrist) * 1.05 || d(tip, wrist) < POINT_ENTER;
    if (fingerUp) {
      if (!s.wasUp && s.alpha < 0.2 && !s.flashed) {
        summonFlash();                                     // 首次召唤 →「风来」
        s.flashed = true;
      }
      s.target = 1;
      if (s.alpha < 0.2) { s.x = c.px; s.y = c.py; }
      s.x += (c.px - s.x) * 0.4;
      s.y += (c.py - s.y) * 0.4;
      s.scale = Math.min(2.2, Math.max(0.7, c.size * 3.4));
      this.spawn(s);
    } else {
      s.target = 0;
    }
  },

  tick(s, dt) {                       // 每渲染帧推进：公转相位
    s.orbitAng = (s.orbitAng + dt * ORBIT_SPEED * s.alpha) % (Math.PI * 2);
  },

  spawn(s) {
    if (s.particles.length > 36) return;
    s.particles.push({
      ang: Math.random() * Math.PI * 2,
      r: 10 + Math.random() * 18, vr: 10 + Math.random() * 18,
      life: 1, hue: 100 + Math.random() * 40
    });
  },

  drawHold(s, t, dt) {
    const bob = Math.sin(t / 260) * 5 * s.scale;          // 悬浮起伏
    const ax = s.x, ay = s.y - 14 * s.scale + bob;        // 锚点略高于指尖
    this.drawSigil(ax, s.y, s, t);
    this.drawParticles(s, ax, ay);
    // 飞镖绕指尖公转，镖身沿轨道切线方向
    const R = ORBIT_RADIUS * s.scale;
    const th = s.orbitAng;
    const ox = ax + Math.cos(th) * R;
    const oy = ay - 46 * s.scale + Math.sin(th) * R * 0.42;
    s.orbitX = ox; s.orbitY = oy;
    const alignRad = Math.atan2(-Math.sin(th), -0.42 * Math.cos(th));
    this.drawDartAt(s, ox, oy, s.alpha, s.scale, alignRad);
  },

  drawSigil(x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = s.alpha * 0.9;
    const R = 34 * s.scale;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.6);
    g.addColorStop(0, "rgba(150,255,190,.55)");
    g.addColorStop(1, "rgba(140,235,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.6, 0, 6.29); ctx.fill();
    ctx.strokeStyle = "rgba(200,255,215,.9)";
    ctx.lineWidth = 2; ctx.setLineDash([6 * s.scale, 9 * s.scale]);
    ctx.lineDashOffset = -t / 22;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.29); ctx.stroke();
    ctx.setLineDash([2 * s.scale, 7 * s.scale]);
    ctx.lineDashOffset = t / 30;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.62, 0, 6.29); ctx.stroke();
    ctx.restore();
  },

  drawParticles(s, ax, ay) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of s.particles) {
      p.ang += 0.09; p.r += p.vr / 60;
      const px = ax + Math.cos(p.ang) * p.r;
      const py = ay - 40 * s.scale + Math.sin(p.ang) * p.r * 0.45;
      ctx.globalAlpha = s.alpha * p.life * 0.9;
      ctx.fillStyle = `hsl(${p.hue} 100% 75%)`;
      ctx.beginPath(); ctx.arc(px, py, 2.2 * s.scale * p.life + 0.5, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  },

  drawDartAt(s, ax, ay, alpha, S, alignRad) {
    const L = 120 * S;
    const cy0 = ay - L * 0.74;
    this.drawDartOnce(ax, cy0, L, s.spin, 0, alpha, false, 1);
  },

  drawDartOnce(cx, cy, L, spin, rot, alpha, bladeOnly, squeeze) {
    if (squeeze === undefined) squeeze = Math.cos(spin);
    const flat = Math.abs(squeeze) < 0.14;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(Math.max(0.06, Math.abs(squeeze)), 1);
    ctx.globalAlpha = alpha;

    const Y = f => -L * 0.5 + L * f;                       // 0=镖尖, 1=柄底
    const black = "#17171b", black2 = "#101014", silver = "#e8edf2";
    const wind = "rgba(150,255,190,.95)";                  // 风元素辉光

    if (!flat) {
      const bw = L * 0.078;
      ctx.fillStyle = black;
      ctx.strokeStyle = silver;
      ctx.lineWidth = Math.max(1, L * 0.012);
      ctx.shadowColor = wind; ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(0, Y(0));
      ctx.quadraticCurveTo(bw * 0.85, Y(0.14), bw, Y(0.36));
      ctx.quadraticCurveTo(bw * 0.55, Y(0.46), L * 0.045, Y(0.50));
      ctx.lineTo(L * 0.052, Y(0.545));
      ctx.lineTo(L * 0.026, Y(0.585));
      ctx.lineTo(-L * 0.026, Y(0.585));
      ctx.lineTo(-L * 0.052, Y(0.545));
      ctx.lineTo(-L * 0.045, Y(0.50));
      ctx.quadraticCurveTo(-bw * 0.55, Y(0.46), -bw, Y(0.36));
      ctx.quadraticCurveTo(-bw * 0.85, Y(0.14), 0, Y(0));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(150,155,160,.85)"; ctx.lineWidth = Math.max(1, L * 0.006);
      ctx.beginPath(); ctx.moveTo(0, Y(0.03)); ctx.lineTo(0, Y(0.40)); ctx.stroke();
      ctx.fillStyle = "#f0f4f8";
      ctx.beginPath();
      ctx.moveTo(0, Y(0.36)); ctx.lineTo(L * 0.017, Y(0.43));
      ctx.lineTo(0, Y(0.50)); ctx.lineTo(-L * 0.017, Y(0.43));
      ctx.closePath(); ctx.fill();
    } else {
      ctx.shadowColor = "rgba(150,255,190,1)"; ctx.shadowBlur = 24;
      ctx.fillStyle = black;
      ctx.fillRect(-1.6, Y(0), 3.2, L);
      ctx.fillStyle = silver;
      ctx.fillRect(-0.8, Y(0), 1.6, L);
      ctx.shadowBlur = 0;
    }

    if (!bladeOnly) {
      ctx.strokeStyle = black; ctx.lineWidth = L * 0.029;
      ctx.beginPath(); ctx.arc(0, Y(0.655), L * 0.0405, 0, 6.29); ctx.stroke();
      ctx.strokeStyle = silver; ctx.lineWidth = Math.max(1, L * 0.007);
      ctx.beginPath(); ctx.arc(0, Y(0.655), L * 0.055, 0, 6.29); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, Y(0.655), L * 0.026, 0, 6.29); ctx.stroke();
      ctx.fillStyle = black2;
      ctx.beginPath();
      ctx.moveTo(-L * 0.030, Y(0.62));
      ctx.lineTo(L * 0.030, Y(0.62));
      ctx.lineTo(L * 0.022, Y(0.97));
      ctx.lineTo(L * 0.034, Y(1.0));
      ctx.lineTo(-L * 0.034, Y(1.0));
      ctx.lineTo(-L * 0.022, Y(0.97));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(154,162,171,.85)"; ctx.lineWidth = Math.max(1, L * 0.011);
      for (const f0 of [0.70, 0.78, 0.86, 0.93]) {
        ctx.beginPath();
        ctx.moveTo(-L * 0.026, Y(f0));
        ctx.lineTo(L * 0.026, Y(f0 + 0.05));
        ctx.stroke();
      }
    }

    ctx.restore();
  }
};

const fireElement = {
  name: "fire", label: "火球",
  hint: "来吧，走起",
  flashText: "火 来 ！", flashBg: "rgba(255,160,80,.3)",
  flashColor: "#fff0e0", flashShadow: "#ffb060", flashShadow2: "#ff7a2f",

  update(s, c) {
    const lm = c.lm, wrist = lm[0];
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    // 摊手判定（对任意手势朝向稳健）：四指伸展 + 拇指外张，带迟滞
    let ext = 0;
    for (const [tt, pp] of [[8, 6], [12, 10], [16, 14], [20, 18]])
      if (d(lm[tt], wrist) > d(lm[pp], wrist) * 1.08) ext++;
    const thumbOut = d(lm[4], lm[5]) > d(lm[2], lm[5]) * 1.15;
    const openNow = s.palm_open ? ext >= 3 : (ext >= 4 && thumbOut);
    if (openNow) {
      if (!s.palm_open && s.alpha < 0.2) {
        s.burstT0 = c.nowS; s.burstX = c.pcx; s.burstY = c.pcy - 90 * s.scale;  // 爆燃
      }
      s.target = 1;
      if (s.alpha < 0.2) { s.x = c.pcx; s.y = c.pcy; }
      // 锚定掌心中心（而非食指尖）：手掌转动时火球依然稳定
      s.x += (c.pcx - s.x) * 0.3;
      s.y += (c.pcy - s.y) * 0.3;
      s.scale = Math.min(2.2, Math.max(0.7, c.size * 3.4));
      this.spawn(s);
    } else {
      s.target = 0;
    }
    s.palm_open = openNow;
  },

  spawn(s) {
    if (s.particles.length > 36) return;
    s.particles.push({
      ang: Math.random() * Math.PI * 2,
      r: 6 + Math.random() * 10, vr: 6 + Math.random() * 10,
      life: 1, hue: 15 + Math.random() * 20
    });
  },

  drawHold(s, t, dt) {
    // 火球悬浮在掌心上方，余烬上飘
    s.orbitX = s.x; s.orbitY = s.y - 90 * s.scale + Math.sin(t / 380) * 6 * s.scale;
    this.drawFireball(s, t);
    this.drawEmbers(s, t);
  },

  drawFireball(s, t) {
    const S = 44 * s.scale, cx = s.orbitX, cy = s.orbitY;
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t / 700);
    ctx.strokeStyle = "rgba(255,180,70,.65)";
    for (let k = 0; k < 14; k++) {
      ctx.lineWidth = 1.5 + (k % 3);
      const a0 = k * (Math.PI * 2 / 14);
      ctx.beginPath();
      ctx.arc(0, 0, S * 1.5, a0, a0 + 0.22 + (k % 3) * 0.09);
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(cx, cy);
    const tongues = [[-Math.PI / 2, 2.0, 10], [-0.5, 1.4, 2], [2.6, 1.3, 4], [3.8, 1.35, 6]];
    for (const [base, ln, ph] of tongues) {
      const fl = 0.7 + 0.3 * Math.sin(t / 105 + ph) + 0.12 * Math.sin(t / 47 + ph * 2);
      const ang = base + 0.1 * Math.sin(t / 330 + ph);
      const Rr = S * 1.5, tipR = S * 1.5 * ln * fl;
      for (const [rr, col] of [[0.85, "rgba(255,170,60,.65)"], [0.62, "rgba(255,230,120,.75)"]]) {
        const tx = Math.cos(ang) * tipR * rr, ty = Math.sin(ang) * tipR * rr;
        const p1x = Math.cos(ang + 0.17) * Rr * rr, p1y = Math.sin(ang + 0.17) * Rr * rr;
        const p2x = Math.cos(ang - 0.17) * Rr * rr, p2y = Math.sin(ang - 0.17) * Rr * rr;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(p1x, p1y);
        ctx.quadraticCurveTo(p1x * 1.3, p1y * 1.3, tx, ty);
        ctx.quadraticCurveTo(p2x * 1.3, p2y * 1.3, p2x, p2y);
        ctx.closePath(); ctx.fill();
      }
    }
    const flick = 1 + 0.07 * Math.sin(t / 90) + 0.05 * Math.sin(t / 34 + 1.7);
    const orbR = S * flick;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, orbR * 2.1);
    g.addColorStop(0, "rgba(255,246,230,.95)");
    g.addColorStop(0.25, "rgba(255,230,120,.9)");
    g.addColorStop(0.55, "rgba(255,160,60,.5)");
    g.addColorStop(1, "rgba(255,120,40,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, orbR * 2.1, 0, 6.29); ctx.fill();
    ctx.restore();
    ctx.restore();   // 关闭最外层 save：防 globalAlpha 泄漏（摄像头闪烁）与状态栈增长（卡顿）
  },

  drawEmbers(s, t) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of s.particles) {
      const x = s.orbitX + Math.cos(p.ang + t / 200) * p.r * s.scale;
      const y = s.orbitY - (1 - p.life) * 70 * s.scale
              + Math.sin(p.ang + t / 200) * p.r * s.scale * 0.4;
      ctx.globalAlpha = s.alpha * p.life * 0.9;
      ctx.fillStyle = `hsl(${p.hue} 100% 70%)`;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(1, 2.0 * s.scale * p.life + 0.5), 0, 6.29);
      ctx.fill();
    }
    ctx.restore();
  }
};

const ELEMENTS = { wind: windElement, fire: fireElement };

/* 抠掉纯色背景 + 裁剪到内容区，返回 canvas */
function keyOutAndTrim(img) {
  const MAX = 300;
  const sc = Math.min(1, MAX / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.max(2, Math.round(img.width * sc));
  cv.height = Math.max(2, Math.round(img.height * sc));
  const c2 = cv.getContext("2d");
  c2.drawImage(img, 0, 0, cv.width, cv.height);
  const im = c2.getImageData(0, 0, cv.width, cv.height);
  const d = im.data;
  // 取四角中位色当背景色
  const corners = [[2,2],[cv.width-3,2],[2,cv.height-3],[cv.width-3,cv.height-3]]
    .map(([x,y]) => [d[(y*cv.width+x)*4], d[(y*cv.width+x)*4+1], d[(y*cv.width+x)*4+2]]);
  const bg = [0,1,2].map(i => corners.map(c => c[i]).sort((a,b)=>a-b)[Math.floor(corners.length/2)]);
  // 颜色距离小于容差 → 透明；按距离羽化
  const TOL = 60, TOL2 = TOL * TOL;
  let minX = cv.width, minY = cv.height, maxX = 0, maxY = 0;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
    const i = (y * cv.width + x) * 4;
    const dist2 = (d[i]-bg[0])**2 + (d[i+1]-bg[1])**2 + (d[i+2]-bg[2])**2;
    if (dist2 < TOL2) d[i+3] = 0;
    else if (dist2 < TOL2 * 2.2) d[i+3] = Math.round(d[i+3] * (dist2 - TOL2) / (TOL2 * 1.2));
    if (d[i+3] > 20) { minX = Math.min(minX,x); maxX = Math.max(maxX,x);
                       minY = Math.min(minY,y); maxY = Math.max(maxY,y); }
  }
  c2.putImageData(im, 0, 0);   // 抠背景后的像素写回画布
  if (maxX <= minX || maxY <= minY) return cv;
  const pad = 4;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(cv.width - 1, maxX + pad); maxY = Math.min(cv.height - 1, maxY + pad);
  const out = document.createElement("canvas");
  out.width = maxX - minX + 1; out.height = maxY - minY + 1;
  const part = c2.getImageData(minX, minY, out.width, out.height);
  out.getContext("2d").putImageData(part, 0, 0);
  return out;
}

function defaultSpec(name) {
  const label = (name || "自定义").replace(/\.[^.]+$/, "").slice(0, 6) || "自定义";
  return { name, label, hint: label, flashText: label,
           glow: "rgba(150,255,190,.9)", particleHue: [100, 140], anchor: "tip" };
}

/* 调用视觉模型（OpenAI 兼容接口，默认智谱 glm-4v-flash 免费），返回 spec 或 null */
async function callVLM(dataUrl) {
  const key = localStorage.getItem("ffx-api-key");
  if (!key) return null;
  const base = localStorage.getItem("ffx-api-base") || "https://open.bigmodel.cn/api/paas/v4";
  const model = localStorage.getItem("ffx-api-model") || "glm-4v-flash";
  const prompt = `看这张特效参考图，为"绕指尖旋转飞行"的特效元素生成配置。只输出 JSON，不要任何其他文字：
{"name":"英文短标识","label":"中文名(不超过6字)","hint":"底部提示(不超过8字)","flashText":"召唤大字(不超过6字)","glowColor":"rgba(r,g,b,a) 辉光颜色(配合图中主色调)","particleHue":[最小色相,最大色相](0-360,风=绿100-140,火=橙15-35,雷=蓝紫200-240,冰=青180-200),"anchor":"tip"}`;
  const res = await fetch(base + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify({ model, messages: [{ role: "user", content: [
      { type: "text", text: prompt },
      { type: "image_url", image_url: { url: dataUrl } } ] }],
      max_tokens: 500 })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  let txt = data.choices[0].message.content.replace(/```json|```/g, "").trim();
  const spec = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
  spec.name = (spec.name || "custom").replace(/[^a-z0-9_-]/gi, "").slice(0, 16) || "custom" + Date.now() % 1000;
  return spec;
}

function registerImageElement(spec, dataUrl, save) {
  spec = Object.assign(defaultSpec(spec.name), spec);
  const existed = !!ELEMENTS[spec.name];        // 已存在 → 直接切换
  const img = new Image();
  img.src = dataUrl;
  const elCfg = {
    name: spec.name, label: spec.label || spec.name, hint: spec.hint || spec.label,
    flashText: spec.flashText || spec.label, flashBg: spec.flashBg || "rgba(150,255,190,.28)",
    flashColor: "#f2fff8", flashShadow: spec.glow || "#7dffb0", flashShadow2: "#2fbf7f",
    update(s, c) {                                        // 与飞镖一致：指尖锚点公转
      const tip = c.lm[8], pip = c.lm[6], wrist = c.lm[0];
      const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const fingerUp = d(tip, wrist) > d(pip, wrist) * 1.05 || d(tip, wrist) < POINT_ENTER;
      if (fingerUp) {
        if (!s.wasUp && s.alpha < 0.2 && !s.flashed) { summonFlash(); s.flashed = true; }
        s.target = 1;
        if (s.alpha < 0.2) { s.x = c.px; s.y = c.py; }
        s.x += (c.px - s.x) * 0.4; s.y += (c.py - s.y) * 0.4;
        s.scale = Math.min(2.2, Math.max(0.7, c.size * 3.4));
        this.spawn(s);
      } else s.target = 0;
    },
    tick(s, dt) { s.orbitAng = (s.orbitAng + dt * ORBIT_SPEED * s.alpha) % (Math.PI * 2); },
    spawn(s) {
      if (s.particles.length > 36) return;
      s.particles.push({ ang: Math.random() * Math.PI * 2,
        r: 10 + Math.random() * 14, vr: 10 + Math.random() * 12,
        life: 1, hue: spec.particleHue[0] + Math.random() * (spec.particleHue[1] - spec.particleHue[0]) });
    },
    drawHold(s, t, dt) {
      const bob = Math.sin(t / 260) * 5 * s.scale;
      const ax = s.x, ay = s.y - 14 * s.scale + bob;
      // 辉光底 + 精灵图（保持长宽比，最长边约 130*scale）
      ctx.save();
      ctx.globalAlpha = s.alpha * 0.9;
      ctx.shadowColor = spec.glow; ctx.shadowBlur = 26 * s.scale;
      const w0 = img.naturalWidth || 200, h0 = img.naturalHeight || 200;
      const L = 130 * s.scale, sc = L / Math.max(w0, h0);
      if (img.complete && img.naturalWidth) {
        ctx.drawImage(img, ax - (w0 * sc) / 2, ay - (h0 * sc) / 2 + 10 * s.scale, w0 * sc, h0 * sc);
      } else {
        ctx.fillStyle = "#888"; ctx.fillRect(ax - 30, ay - 30, 60, 60);
      }
      ctx.restore();
      // 粒子
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const p of s.particles) {
        p.ang += 0.09; p.r += p.vr / 60;
        const px = ax + Math.cos(p.ang) * p.r;
        const py = ay - 40 * s.scale + Math.sin(p.ang) * p.r * 0.45;
        ctx.globalAlpha = s.alpha * p.life * 0.9;
        ctx.fillStyle = `hsl(${p.hue} 100% 75%)`;
        ctx.beginPath(); ctx.arc(px, py, 2.0 * s.scale * p.life + 0.5, 0, 6.29); ctx.fill();
      }
      ctx.restore();
    }
  };
  ELEMENTS[spec.name] = elCfg;
  if (!existed) addPickerButton(spec.name, elCfg);
  if (save) {
    try {
      const arr = JSON.parse(localStorage.getItem(CUSTOM_STORE) || "[]");
      const others = arr.filter(c => c.name !== spec.name);
      others.unshift(Object.assign({}, spec, { sprite: dataUrl }));
      localStorage.setItem(CUSTOM_STORE, JSON.stringify(others.slice(0, 5)));
    } catch (e) { console.warn("自定义元素存储失败", e); }
  }
}

async function handleUploadFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  hint.textContent = "正在处理图片…";
  const dataUrl = await new Promise((res) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => res(keyOutAndTrim(img).toDataURL("image/png"));
      img.src = r.result;   // FileReader 的结果在自身 .result 上（不是 .target）
    };
    r.readAsDataURL(file);
  });
  let spec = null;
  if (localStorage.getItem("ffx-api-key")) {
    hint.textContent = "AI 正在识别图片…";
    try { spec = await callVLM(dataUrl); }
    catch (e) { console.warn("AI 识别失败", e); hint.textContent = "AI 识别失败，已用默认配置"; }
  } else {
    hint.textContent = "未配置 AI 密钥，已用默认配置（点 ⚙ 可设置）";
  }
  registerImageElement(spec || defaultSpec(file.name), dataUrl, true);
  setElement(spec ? spec.name : Object.keys(ELEMENTS).pop());
  if (!hint.classList.contains("err")) hint.textContent = ELEMENTS[ELEMENT].hint;
}

/* ================= 框架（以下与具体元素无关） ================= */

const swords = [makeSword(), makeSword()];   // 最多追踪两只手
window.__swords = swords;                    // 调试用：可在控制台查看特效状态

// 元素选择（按钮或按 1 / 2 / 3... 切换，记忆在 localStorage）
let ELEMENT = localStorage.getItem("ffx-element") || "wind";
const urlEl = new URLSearchParams(location.search).get("element");
if (ELEMENTS[urlEl]) ELEMENT = urlEl;
let camReady = false;              // 摄像头就绪后，底部提示显示当前元素的口令

function makeSword() {
  return { alpha: 0, target: 0, x: 0, y: 0,
           scale: 1, wasUp: false, flashed: false, particles: [],
           burstT0: -10, burstX: 0, burstY: 0,
           orbitAng: Math.random() * 6.28, orbitX: 0, orbitY: 0,
           palm_open: false, lastSeen: 0 };
}

function setElement(el) {
  if (!ELEMENTS[el]) return;
  ELEMENT = el;
  localStorage.setItem("ffx-element", el);
  for (const [key, b] of Object.entries(elementBtns))
    b.classList.toggle("on", key === el);
  if (camReady && !hint.classList.contains("err")) {
    hint.textContent = ELEMENTS[el].hint;
  }
  for (const s of swords) {
    s.alpha = 0; s.target = 0;
    s.flashed = false; s.palm_open = false;
  }
}

function summonFlash() {
  const cfg = ELEMENTS[ELEMENT];
  flashBg.style.background = `radial-gradient(circle at 50% 55%, ${cfg.flashBg}, transparent 60%)`;
  flashBg.style.transition = "none"; flashBg.style.opacity = "1";
  requestAnimationFrame(() => {
    flashBg.style.transition = "opacity .8s"; flashBg.style.opacity = "0";
  });
  const el = document.createElement("div");
  el.textContent = cfg.flashText;
  el.style.cssText = `position:absolute;left:50%;top:16%;transform:translateX(-50%);
    font:900 72px/1 "PingFang SC","Microsoft YaHei",serif;letter-spacing:14px;
    color:${cfg.flashColor};
    text-shadow:0 0 24px ${cfg.flashShadow},0 0 60px ${cfg.flashShadow2};
    pointer-events:none;transition:all 1.1s ease-out;white-space:nowrap;`;
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.opacity = "0"; el.style.top = "11%"; el.style.letterSpacing = "34px";
  });
  setTimeout(() => el.remove(), 1200);
}

function spawnParticles(s) {
  ELEMENTS[ELEMENT].spawn(s);
}

/* ---------------- 手势配对 → 当前元素 ---------------- */
function updateFromHands(handsList) {
  // 手与特效状态配对：MediaPipe 返回的手序可能逐帧交换，
  // 按“与上次位置最近”贪心配对，避免双手互换导致特效跳变
  const handFor = [null, null];
  const used = handsList.map(() => false);
  // 快速移动时一只手常被识别成两个相距很近的检测 → 去重，否则一只手出现两个特效
  const minSep = canvas.width * 0.15;
  const kept = [], keptPos = [];
  handsList.forEach((lm, hi) => {
    const hx = (1 - lm[8].x) * canvas.width, hy = lm[8].y * canvas.height;
    if (keptPos.every(k => Math.hypot(hx - k[0], hy - k[1]) >= minSep)) {
      kept.push(hi); keptPos.push([hx, hy]);
    }
  });
  // 活跃中的特效优先认领最近的手——移动时不会被闲置状态抢走
  const order = swords.map((s, si) => ({ si, active: s.alpha > 0.05 }))
                      .sort((a, b) => (b.active ? 1 : 0) - (a.active ? 1 : 0));
  for (const { si } of order) {
    const s = swords[si];
    let best = -1, bestD = Infinity;
    kept.forEach((hi) => {
      if (used[hi]) return;
      const lm = handsList[hi];
      const hx = (1 - lm[8].x) * canvas.width, hy = lm[8].y * canvas.height;
      const d = Math.hypot(hx - s.x, hy - s.y);
      if (d < bestD) { bestD = d; best = hi; }
    });
    if (best >= 0) { handFor[si] = handsList[best]; used[best] = true; }
  }

  swords.forEach((s, si) => {
    const lm = handFor[si];
    const nowS = performance.now() / 1000;
    if (!lm) {
      // 手快速移动时检测偶尔掉帧：宽限期内原地保持（火球继续烧、飞镖继续转），不闪断
      const lost = nowS - (s.lastSeen || -1e9);
      if (s.mode === "hold" && s.alpha > 0.03 && lost < HAND_LOST_GRACE) return;
      if (s.mode === "hold") s.target = 0;
      s.palm_open = false;
      return;
    }
    s.lastSeen = nowS;
    const tip = lm[8], wrist = lm[0];
    const px = (1 - tip.x) * canvas.width;                       // 镜像
    const py = tip.y * canvas.height;
    // 掌心中心（手腕 + 四指根的中点）：火球等掌心特效的稳定锚点
    const pcx = (1 - [0, 5, 9, 13, 17].reduce((v, k) => v + lm[k].x, 0) / 5) * canvas.width;
    const pcy = ([0, 5, 9, 13, 17].reduce((v, k) => v + lm[k].y, 0) / 5) * canvas.height;
    const size = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);   // 手越大离镜头越近
    ELEMENTS[ELEMENT].update(s, { lm, px, py, pcx, pcy, size, nowS });
  });
}

/* 演示模式虚拟手（21 点）：手指竖起；point_forward 时食指指向镜头 */
function fake_hand(t, point_forward) {
  const lm = [];
  for (let i = 0; i < 21; i++) lm.push({ x: 0.5, y: 0.78, z: 0 });
  const wx = 0.5 + Math.sin(t / 900) * 0.18, wy = 0.78;
  const seti = (i, dx, dy) => { lm[i].x = wx + dx; lm[i].y = wy + dy; };
  seti(0, 0, 0);
  for (const [i, dx, dy] of [[5, -0.03, -0.12], [9, 0.0, -0.13],
                             [13, 0.03, -0.12], [17, 0.06, -0.10]]) seti(i, dx, dy);
  for (const [tip, dx] of [[8, -0.06], [12, 0.0], [16, 0.03], [20, 0.06]]) seti(tip, dx, -0.30);
  for (const [pip, dx] of [[6, -0.045], [10, 0.0], [14, 0.03], [18, 0.06]]) seti(pip, dx, -0.19);
  seti(2, -0.02, -0.06);
  seti(4, -0.13, -0.18);   // 拇指明显外张（火球摊手判定需要）
  if (point_forward) seti(8, -0.02, -0.10);
  return lm;
}

/* ---------------- 初始化 ---------------- */
let lastVideoTime = -1, landmarker = null, loopT0 = 0, warnedNoFrames = false;

async function init() {
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
    const make = (delegate) => HandLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate
      },
      runningMode: "VIDEO",
      numHands: 2
    });
    // GPU 初始化偶尔会挂起（多标签页/驱动问题），8 秒未完成则回退 CPU
    landmarker = await Promise.race([
      make("GPU"),
      new Promise((_, rej) => setTimeout(() => rej(new Error("GPU 超时")), 8000))
    ]).catch(() => make("CPU"));
  } catch (e) {
    hint.textContent = "模型加载失败，请检查网络后刷新：" + e.message;
    hint.classList.add("err");
    return;
  }
  if (DEMO) {
    canvas.width = 1280; canvas.height = 720;
    hint.textContent = "演示模式：右上角可切换元素";
    startLoop(); return;
  }
  hint.textContent = "模型就绪，正在连接摄像头…";
  try {
    const stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({
        video: { width: 1280, height: 720, facingMode: "user" }, audio: false
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error("请求超时")), 10000))
    ]);
    video.srcObject = stream;
    // play() 要等首帧才 resolve，某些虚拟设备/慢启动下会久等，不要阻塞主流程
    await Promise.race([video.play(), new Promise(r => setTimeout(r, 8000))]);
  } catch (e) {
    hint.textContent = "无法访问摄像头（" + e.name + ": " + e.message + "），请允许权限后刷新，或在地址后加 ?demo 看演示";
    hint.classList.add("err");
    return;
  }
  canvas.width  = video.videoWidth  || 1280;
  canvas.height = video.videoHeight || 720;
  camReady = true;
  hint.textContent = ELEMENTS[ELEMENT].hint;
  loopT0 = performance.now();
  startLoop();
}

/* ---------------- 主循环 ---------------- */
function startLoop() { requestAnimationFrame(tick); }

function tick(t) {
  requestAnimationFrame(tick);            // 先排下一帧，单帧异常不会中断循环
  try {
    if (!DEMO && video.readyState < 2) {  // 摄像头还没有可用画面
      if (!warnedNoFrames && performance.now() - loopT0 > 5000) {
        warnedNoFrames = true;
        hint.textContent = "⚠️ 一直收不到摄像头画面：请改用 Safari / Chrome 打开本页";
        hint.classList.add("err");
      }
      return;
    }
    if (!DEMO && video.videoWidth && canvas.width !== video.videoWidth) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    }
    if (DEMO) {
      // 演示：虚拟手（周期性指向镜头，供有发射阶段的元素演示）
      updateFromHands([fake_hand(t / 1000, (t / 1000) % 4.5 < 0.5)]);
    } else if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      updateFromHands(landmarker.detectForVideo(video, t).landmarks || []);
    }

    const dt = Math.min(0.05, Math.max(0.001, (t - _lastTickT) / 1000));  // 真实帧间隔
    _lastTickT = t;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!DEMO) {                       // 镜像绘制摄像头画面
      ctx.save();
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    } else {                           // 演示模式背景
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, "#0b1220"); g.addColorStop(1, "#1a1030");
      ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    const el = ELEMENTS[ELEMENT];
    for (const s of swords) {
      s.alpha += (s.target - s.alpha) * 0.18;
      if (el.tick) el.tick(s, dt);
      if (s.alpha > 0.03) el.drawHold(s, t, dt);
      s.wasUp = s.target > 0.5;
      s.particles = s.particles.filter(p => (p.life -= dt * 1.4) > 0);
      drawBurst(s, t / 1000);
    }
  } catch (e) { console.warn("frame error:", e); }
}

/* 发射/爆燃时的枪口火光：白色闪光核心 + 扩散圆环 + 放射速度线 */
function drawBurst(s, nowS) {
  const ft = nowS - s.burstT0;
  if (ft < 0 || ft > 0.45) return;
  if (ft <= 0.12) {                      // 白色闪光核心
    const q = ft / 0.12, r0 = 26 + 90 * q;
    const g = ctx.createRadialGradient(s.burstX, s.burstY, 0, s.burstX, s.burstY, r0);
    g.addColorStop(0, "rgba(255,255,255," + 0.9 * (1 - q) + ")");
    g.addColorStop(1, "rgba(200,240,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.burstX, s.burstY, r0, 0, 6.29); ctx.fill();
  }
  const p = ft / 0.45, R = 16 + 150 * p, a = (1 - p) * 0.85;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = "rgba(200,255,190,.95)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(s.burstX, s.burstY, R, 0, 6.29); ctx.stroke();
  ctx.strokeStyle = "rgba(210,255,200,.8)"; ctx.lineWidth = 2;
  for (let k = 0; k < 14; k++) {
    const ang = k * Math.PI * 2 / 14 + 0.2;
    ctx.beginPath();
    ctx.moveTo(s.burstX + Math.cos(ang) * R * 0.55, s.burstY + Math.sin(ang) * R * 0.55);
    ctx.lineTo(s.burstX + Math.cos(ang) * R * 0.95, s.burstY + Math.sin(ang) * R * 0.95);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- 元素选择 UI ---------------- */
const picker = document.getElementById("picker");
const elementBtns = {};
for (const [key, elCfg] of Object.entries(ELEMENTS)) {
  const b = document.createElement("button");
  b.textContent = elCfg.label;
  b.addEventListener("click", () => setElement(key));
  picker.appendChild(b);
  elementBtns[key] = b;
}
window.addEventListener("keydown", (e) => {
  const keys = Object.keys(ELEMENTS);
  const idx = parseInt(e.key, 10) - 1;
  if (idx >= 0 && idx < keys.length) setElement(keys[idx]);
});
setElement(ELEMENT);

document.getElementById("btn-upload").addEventListener("click",
  () => document.getElementById("file-input").click());
document.getElementById("file-input").addEventListener("change", (e) => {
  handleUploadFile(e.target.files[0]); e.target.value = "";
});
document.getElementById("btn-ai-set").addEventListener("click", () => {
  const key = prompt("粘贴视觉模型的 API Key（留空跳过，效果用默认配置）：",
    localStorage.getItem("ffx-api-key") || "");
  if (key === null) return;
  if (key) localStorage.setItem("ffx-api-key", key); else localStorage.removeItem("ffx-api-key");
  const base = prompt("API 地址（OpenAI 兼容，直接回车用智谱默认）：",
    localStorage.getItem("ffx-api-base") || "https://open.bigmodel.cn/api/paas/v4");
  if (base) localStorage.setItem("ffx-api-base", base);
  const model = prompt("模型名（直接回车用 glm-4v-flash，免费）：",
    localStorage.getItem("ffx-api-model") || "glm-4v-flash");
  if (model) localStorage.setItem("ffx-api-model", model);
  alert("已保存。上传图片时会自动调用 AI 识别配置。");
});

// 启动时恢复历史自定义元素
try {
  JSON.parse(localStorage.getItem(CUSTOM_STORE) || "[]")
    .forEach(cfg => registerImageElement(cfg, cfg.sprite, false));
} catch (e) { console.warn("自定义元素恢复失败", e); }

init();
</script>
